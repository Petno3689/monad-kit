[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.38"
# Tests and scripts run with Monad's EVM rules and gas pricing (cold account 10 100,
# cold storage page 8 100 per 128 slots), so gas checks match the chain; supported since Foundry 1.8.
network = "monad"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Sourcify verification on Monad: the bytecode must not embed the metadata hash,
# while the CBOR metadata and literal sources stay, so a rebuild matches the deployed code.
bytecode_hash = "none"
cbor_metadata = true
use_literal_content = true

# Generators write golden vectors there; golden tests read them.
fs_permissions = [{ access = "read-write", path = "../shared/test/vectors" }]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
